name: Ubuntu Tailscale Exit Node
 
on:
  schedule:
    - cron: '37 6,12,18,00 * * *'
      timezone: 'Asia/Tehran'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 359

    steps:
      - name: 1. Prepare Ubuntu
        shell: bash
        run: |
          set -euo pipefail

          echo "Preparing Ubuntu environment..."
          lsb_release -a

          sudo apt-get update
          sudo apt-get install -y curl ca-certificates iproute2

      - name: 2. Enable IP Forwarding
        shell: bash
        run: |
          set -euo pipefail

          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1

          echo "IPv4 and IPv6 forwarding enabled."

      - name: 3. Install and Start Tailscale
        shell: bash
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail

          if [[ -z "${TAILSCALE_AUTHKEY:-}" ]]; then
            echo "ERROR: TAILSCALE_AUTHKEY secret is missing."
            exit 1
          fi

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo systemctl enable --now tailscaled

          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTHKEY" \
            --hostname="ghand" \
            --advertise-exit-node

          echo "Waiting for Tailscale connection..."

          TS_IP=""

          for i in $(seq 1 30); do
            TS_IP="$(tailscale ip -4 2>/dev/null || true)"

            if [[ -n "$TS_IP" ]]; then
              break
            fi

            sleep 2
          done

          if [[ -z "$TS_IP" ]]; then
            echo "ERROR: Tailscale did not obtain an IP address."
            exit 1
          fi

          echo "=========================================="
          echo "Ubuntu Tailscale Exit Node is connected"
          echo "Tailscale IPv4: $TS_IP"
          echo "Exit Node advertisement: enabled"
          echo "=========================================="

      - name: 4. Check Network
        shell: bash
        run: |
          set -euo pipefail

          echo "Tailscale status:"
          tailscale status

          echo "Public IP before/after Tailscale setup:"
          curl -4 --max-time 15 -fsS https://api.ipify.org || true
          echo

      - name: 5. Keep Runner Alive
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 370); do
            echo "[$i/370] Ubuntu runner is active"
            sleep 60
          done
