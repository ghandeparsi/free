name: Ubuntu with mhs
 
on:
  schedule:
    - cron: '37 6,12,18,00 * * *'
      timezone: 'Asia/Tehran'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 359

    steps:
      - name: 1. Prepare Ubuntu
        shell: bash
        run: |
          set -euo pipefail

          echo "Preparing Ubuntu environment..."
          lsb_release -a

          sudo apt-get update
          sudo apt-get install -y curl ca-certificates iproute2

      - name: 2. Enable IP Forwarding
        shell: bash
        run: |
          set -euo pipefail

          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1

          echo "IPv4 and IPv6 forwarding enabled."  
      
      - name: 3. Install mhs
        run: |
          sudo wget https://raw.githubusercontent.com/ghandeparsi/free/main/install.sh
          sudo chmod +x install.sh
          sudo bash install.sh       

      - name: 4. Keep Runner Alive
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 370); do
            echo "[$i/370] Ubuntu runner is active"
            sleep 60
          done
